<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 14px; margin: 0; padding: 20px; background: #f9f9f9; }
    h3 { margin: 0 0 18px; font-size: 16px; color: #333; }
    .row { display: flex; align-items: center; margin-bottom: 14px; gap: 12px; }
    label { width: 100px; font-weight: bold; color: #555; flex-shrink: 0; }
    select, input[type=number] {
      padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px;
      font-size: 14px; background: #fff;
    }
    input[type=number] { width: 100px; }
    button { padding: 10px 28px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
    #btnGenerate { background: #FF9900; color: #fff; font-weight: bold; }
    #btnGenerate:hover { background: #e68a00; }
    #btnGenerate:disabled { background: #ccc; cursor: default; }
    #msg { margin-top: 16px; padding: 10px 14px; border-radius: 4px; display: none; font-size: 13px; }
    .ok  { background: #e6f4ea; color: #2d6a2d; border: 1px solid #a8d5b5; }
    .err { background: #fdecea; color: #922; border: 1px solid #f5c6c6; }
    .spinner { display: none; margin-top: 16px; color: #888; font-size: 13px; }
  </style>
</head>
<body>
  <h3>掲載リスト作成</h3>

  <div class="row">
    <label>メインブランド</label>
    <select id="selBrand"><option value="">読み込み中...</option></select>
  </div>
  <div class="row">
    <label>年</label>
    <input type="number" id="inpYear" min="2020" max="2099" step="1">
  </div>
  <div class="row" style="margin-top:6px;">
    <button id="btnGenerate" onclick="doGenerate()">生成する</button>
  </div>

  <div class="spinner" id="spinner">生成中...</div>
  <div id="msg"></div>

  <script>
    // 年の初期値を今年に設定
    (function() {
      document.getElementById('inpYear').value = new Date().getFullYear();
    })();

    // メインブランド一覧を取得
    google.script.run
      .withSuccessHandler(function(list) {
        var sel = document.getElementById('selBrand');
        if (!list || list.length === 0) {
          sel.innerHTML = '<option value="">（品番マスタにデータなし）</option>';
          return;
        }
        sel.innerHTML = '';
        list.forEach(function(brand) {
          var opt = document.createElement('option');
          opt.value = brand;
          opt.text  = brand;
          sel.appendChild(opt);
        });
      })
      .withFailureHandler(function(err) {
        document.getElementById('selBrand').innerHTML = '<option value="">取得エラー</option>';
      })
      .getMainBrandList();

    function doGenerate() {
      var brand = document.getElementById('selBrand').value;
      var year  = Number(document.getElementById('inpYear').value);

      if (!brand) { showMsg('メインブランドを選択してください。', 'err'); return; }
      if (!year || year < 2020 || year > 2099) { showMsg('有効な年を入力してください（2020〜2099）。', 'err'); return; }

      var btn = document.getElementById('btnGenerate');
      btn.disabled = true;
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('msg').style.display = 'none';

      google.script.run
        .withSuccessHandler(function(res) {
          document.getElementById('spinner').style.display = 'none';
          btn.disabled = false;
          if (res.success) {
            showMsg('「' + res.sheetName + '」を生成しました（' + res.rowCount + '行）。', 'ok');
          } else {
            showMsg(res.message || '生成に失敗しました。', 'err');
          }
        })
        .withFailureHandler(function(err) {
          document.getElementById('spinner').style.display = 'none';
          btn.disabled = false;
          showMsg('エラー: ' + err.message, 'err');
        })
        .generateFormattedSheet({ mainBrand: brand, year: year });
    }

    function showMsg(text, cls) {
      var el = document.getElementById('msg');
      el.className = cls;
      el.textContent = text;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
