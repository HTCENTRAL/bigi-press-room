<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', sans-serif; font-size: 13px; color: #333; background: #f9f9f9; }
    .section { background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 12px; margin: 8px; }
    .section-title { font-weight: bold; font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
    label { display: block; font-size: 12px; color: #555; margin-bottom: 3px; margin-top: 8px; }
    label:first-of-type { margin-top: 0; }
    input[type=text], input[type=date], input[type=number], select {
      width: 100%; padding: 7px 9px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px;
      transition: border-color 0.2s; background: #fff;
    }
    input:focus, select:focus { outline: none; border-color: #4a90d9; }
    input.auto-filled { background: #f0f7ff; color: #333; }
    .media-set {
      padding: 10px; background: #f7f9fc; border: 1px solid #dce7f5;
      border-radius: 5px; margin-bottom: 8px; position: relative;
    }
    .media-set-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .media-set-grid .full { grid-column: 1 / -1; }
    .item-row {
      padding: 10px; background: #f7f9fc; border: 1px solid #dce7f5;
      border-radius: 5px; margin-bottom: 8px; position: relative;
    }
    .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .item-grid .full { grid-column: 1 / -1; }
    .lookup-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; align-items: end; margin-bottom: 6px; }
    .remove-btn {
      position: absolute; top: 6px; right: 8px;
      background: none; border: none; color: #cc0000; font-size: 16px;
      cursor: pointer; line-height: 1; padding: 0 4px;
    }
    .remove-btn:hover { color: #990000; }
    .add-btn {
      width: 100%; padding: 8px; background: #e8f0fe; color: #1a56db;
      border: 1px dashed #93b4f5; border-radius: 4px; cursor: pointer;
      font-size: 13px; margin-top: 2px; transition: background 0.2s;
    }
    .add-btn:hover { background: #d0e1fd; }
    .lookup-btn {
      padding: 7px 12px; background: #1a56db; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 12px;
      white-space: nowrap; height: 34px;
    }
    .lookup-btn:hover { background: #1545b3; }
    .lookup-btn:disabled { background: #aaa; cursor: not-allowed; }
    .submit-btn {
      width: calc(100% - 16px); margin: 8px; padding: 12px;
      background: #1a56db; color: #fff; border: none; border-radius: 6px;
      font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.2s;
    }
    .submit-btn:hover { background: #1545b3; }
    .submit-btn:disabled { background: #aaa; cursor: not-allowed; }
    .result-box {
      margin: 8px; padding: 12px; background: #e6f4ea; border: 1px solid #aad4b2;
      border-radius: 6px; display: none;
    }
    .result-box.error { background: #fce8e6; border-color: #f5c6c3; }
    .result-title { font-weight: bold; margin-bottom: 8px; color: #1e6b2e; }
    .result-box.error .result-title { color: #c0392b; }
    .reset-btn {
      padding: 8px 16px; background: #fff; color: #1a56db;
      border: 1px solid #1a56db; border-radius: 4px; cursor: pointer;
      font-size: 13px; font-weight: bold; white-space: nowrap; width: 100%;
    }
    .reset-btn:hover { background: #e8f0fe; }
  </style>
</head>
<body>

<div class="section">
  <div class="section-title">起票者</div>
  <label>起票者名 <span style="color:red">*</span></label>
  <input type="text" id="staff" placeholder="例：山田 太郎">
</div>

<div class="section">
  <div class="section-title">貸出先情報</div>
  <label>お名前 <span style="color:red">*</span></label>
  <input type="text" id="name" list="contactNameList" placeholder="例：石上 恵" autocomplete="off">
  <datalist id="contactNameList"></datalist>
  <label>電話番号</label>
  <input type="text" id="phone" placeholder="例：090-1234-5678">
</div>

<div class="section">
  <div class="section-title">媒体セット <span style="color:red">*</span></div>
  <div id="mediaSetList"></div>
  <button class="add-btn" onclick="addMediaSet()">＋ 媒体セットを追加</button>
</div>

<div class="section">
  <div class="section-title">撮影情報</div>
  <label>ピックアップ日</label>
  <input type="date" id="pickupDate">
  <label>返却予定日</label>
  <input type="date" id="plannedReturnDate">
  <label>一部返却日</label>
  <input type="date" id="partialReturnDate">
</div>

<div class="section">
  <div class="section-title">貸出アイテム <span style="color:red">*</span></div>
  <div id="itemList"></div>
  <button class="add-btn" onclick="addItem()">＋ アイテムを追加</button>
</div>

<button class="submit-btn" id="submitBtn" onclick="submit()">登録する</button>

<div class="result-box" id="resultBox">
  <div class="result-title" id="resultTitle"></div>
  <div id="resultMsg"></div>
</div>

<script>
  var mediaSetCount = 0;
  var itemCount = 0;
  var contactMap = {};

  // 貸出先マスタ読み込み（名前→電話番号のlookup用）
  google.script.run
    .withSuccessHandler(function(list) {
      var dl = document.getElementById('contactNameList');
      list.forEach(function(c) {
        if (c.name) contactMap[c.name] = c.phone || '';
        var opt = document.createElement('option');
        opt.value = c.name;
        dl.appendChild(opt);
      });
    })
    .withFailureHandler(function() {})
    .getContactList();

  // お名前変更時に電話番号を自動補完
  document.getElementById('name').addEventListener('change', function() {
    var n = this.value.trim();
    if (contactMap.hasOwnProperty(n)) {
      document.getElementById('phone').value = contactMap[n];
    }
  });

  // ピックアップ日のデフォルトを今日に設定
  (function() {
    var t = new Date();
    var y = t.getFullYear();
    var m = String(t.getMonth() + 1).padStart(2, '0');
    var d = String(t.getDate()).padStart(2, '0');
    document.getElementById('pickupDate').value = y + '-' + m + '-' + d;
  })();

  function addMediaSet() {
    mediaSetCount++;
    var id = 'ms_' + mediaSetCount;
    var div = document.createElement('div');
    div.className = 'media-set';
    div.id = id;
    div.innerHTML =
      '<button class="remove-btn" onclick="removeEl(\'' + id + '\')" title="削除">✕</button>' +
      '<div class="media-set-grid">' +
        '<div class="full"><label>種別 <span style="color:red">*</span></label>' +
          '<select id="' + id + '_type">' +
            '<option value="雑誌(紙面)">雑誌(紙面)</option>' +
            '<option value="雑誌(WEB)">雑誌(WEB)</option>' +
            '<option value="TV">TV</option>' +
            '<option value="その他">その他</option>' +
          '</select></div>' +
        '<div class="full"><label>媒体名 <span style="color:red">*</span></label>' +
          '<input type="text" id="' + id + '_media" placeholder="例：Vogue"></div>' +
        '<div><label>月号/放送局 <span style="color:red">*</span></label>' +
          '<input type="text" id="' + id + '_issue" placeholder="例：4月号"></div>' +
        '<div><label>公開日 <span style="color:red">*</span></label>' +
          '<input type="date" id="' + id + '_releaseDate"></div>' +
        '<div class="full"><label>テーマ/着用者 <span style="color:red">*</span></label>' +
          '<input type="text" id="' + id + '_theme" placeholder="例：夏コーデ/石上恵"></div>' +
        '<div><label>撮影日</label>' +
          '<input type="date" id="' + id + '_shootDate"></div>' +
      '</div>';
    document.getElementById('mediaSetList').appendChild(div);
  }

  function addItem() {
    itemCount++;
    var id = 'item_' + itemCount;
    var div = document.createElement('div');
    div.className = 'item-row';
    div.id = id;
    div.innerHTML =
      '<button class="remove-btn" onclick="removeEl(\'' + id + '\')" title="削除">✕</button>' +
      '<div class="lookup-row">' +
        '<div><label>品番 <span style="color:red">*</span></label>' +
          '<input type="text" id="' + id + '_code" placeholder="例：62AFP349"></div>' +
        '<div><label>カラー <span style="color:red">*</span></label>' +
          '<input type="text" id="' + id + '_color" placeholder="例：01"></div>' +
        '<div><label style="visibility:hidden;">_</label>' +
          '<button class="lookup-btn" id="' + id + '_lbtn" onclick="lookupItem(\'' + id + '\')">マスタ検索</button></div>' +
      '</div>' +
      '<div class="item-grid">' +
        '<div><label>メインブランド</label>' +
          '<input type="text" id="' + id + '_mainBrand" class="auto-filled" readonly placeholder="検索で自動入力"></div>' +
        '<div><label>ブランド</label>' +
          '<input type="text" id="' + id + '_brand" class="auto-filled" readonly placeholder="検索で自動入力"></div>' +
        '<div><label>カラー名</label>' +
          '<input type="text" id="' + id + '_colorName" class="auto-filled" placeholder="検索で自動入力"></div>' +
        '<div><label>単価(税込) <span style="color:red">*</span></label>' +
          '<input type="number" id="' + id + '_price" class="auto-filled" placeholder="60500" min="0"></div>' +
        '<div class="full"><label>アイテム名 <span style="color:red">*</span></label>' +
          '<input type="text" id="' + id + '_itemName" class="auto-filled" placeholder="検索で自動入力（直接入力も可）"></div>' +
      '</div>';
    document.getElementById('itemList').appendChild(div);
  }

  function lookupItem(id) {
    var code  = (document.getElementById(id + '_code')  || {}).value || '';
    var color = (document.getElementById(id + '_color') || {}).value || '';
    if (!code.trim() || !color.trim()) {
      alert('品番とカラーを入力してからマスタ検索してください。');
      return;
    }
    var btn = document.getElementById(id + '_lbtn');
    btn.disabled = true;
    btn.textContent = '検索中...';

    google.script.run
      .withSuccessHandler(function(result) {
        btn.disabled = false;
        btn.textContent = 'マスタ検索';
        if (!result) {
          alert('品番マスタに該当データが見つかりませんでした。\n直接入力してください。');
          return;
        }
        document.getElementById(id + '_mainBrand').value = result.mainBrand || '';
        document.getElementById(id + '_brand').value     = result.brand     || '';
        document.getElementById(id + '_colorName').value = result.colorName || '';
        document.getElementById(id + '_price').value     = result.price     || '';
        document.getElementById(id + '_itemName').value  = result.itemName  || '';
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = 'マスタ検索';
        if (err.message && err.message.indexOf('承認') !== -1) return;
        alert('マスタ検索エラー: ' + err.message);
      })
      .lookupItemMaster(code.trim(), color.trim());
  }

  function removeEl(id) {
    var el = document.getElementById(id);
    if (el) el.remove();
  }

  function getMediaSets() {
    var sets = [];
    var els = document.querySelectorAll('#mediaSetList .media-set');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      var id = el.id;
      var media = ((document.getElementById(id + '_media') || {}).value || '').trim();
      if (!media) continue;
      var issue       = ((document.getElementById(id + '_issue')       || {}).value || '').trim();
      var theme       = ((document.getElementById(id + '_theme')       || {}).value || '').trim();
      var releaseDate = ((document.getElementById(id + '_releaseDate') || {}).value || '');
      if (!issue)       { alert('媒体「' + media + '」の月号/放送局を入力してください。'); return null; }
      if (!theme)       { alert('媒体「' + media + '」のテーマ/着用者を入力してください。'); return null; }
      if (!releaseDate) { alert('媒体「' + media + '」の公開日を入力してください。'); return null; }
      sets.push({
        type:        ((document.getElementById(id + '_type')      || {}).value || ''),
        media:       media,
        issue:       issue,
        theme:       theme,
        releaseDate: releaseDate,
        shootDate:   ((document.getElementById(id + '_shootDate') || {}).value || '')
      });
    }
    return sets;
  }

  function getItems() {
    var items = [];
    var els = document.querySelectorAll('#itemList .item-row');
    for (var i = 0; i < els.length; i++) {
      var row = els[i];
      var id  = row.id;
      var code      = ((document.getElementById(id + '_code')      || {}).value || '').trim();
      var colorCode = ((document.getElementById(id + '_color')     || {}).value || '').trim();
      var itemName  = ((document.getElementById(id + '_itemName')  || {}).value || '').trim();
      var price     = ((document.getElementById(id + '_price')     || {}).value || '').trim();
      if (!code && !itemName) continue;
      if (!code)      { alert('アイテムの品番を入力してください。'); return null; }
      if (!colorCode) { alert('アイテムのカラーを入力してください。'); return null; }
      if (!itemName)  { alert('アイテム名を入力してください。'); return null; }
      if (!price)     { alert('アイテムの単価(税込)を入力してください。'); return null; }
      items.push({
        mainBrand: ((document.getElementById(id + '_mainBrand') || {}).value || '').trim(),
        brand:     ((document.getElementById(id + '_brand')     || {}).value || '').trim(),
        itemCode:  code,
        colorCode: colorCode,
        colorName: ((document.getElementById(id + '_colorName') || {}).value || '').trim(),
        itemName:  itemName,
        price:     price
      });
    }
    return items;
  }

  function submit() {
    var staff = document.getElementById('staff').value.trim();
    if (!staff) { alert('起票者名を入力してください。'); return; }
    var name = document.getElementById('name').value.trim();
    if (!name) { alert('お名前を入力してください。'); return; }
    var mediaSets = getMediaSets();
    if (mediaSets === null) return;
    if (mediaSets.length === 0) { alert('媒体セットを1つ以上追加してください。'); return; }
    var items = getItems();
    if (items === null) return;
    if (items.length === 0) { alert('アイテムを1つ以上追加してください。'); return; }

    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '登録中...';

    var data = {
      staff:              staff,
      name:               name,
      phone:              document.getElementById('phone').value.trim(),
      mediaSets:          mediaSets,
      pickupDate:         document.getElementById('pickupDate').value,
      plannedReturnDate:  document.getElementById('plannedReturnDate').value,
      partialReturnDate:  document.getElementById('partialReturnDate').value,
      items:              items
    };

    google.script.run
      .withSuccessHandler(function(res) {
        showResult(res);
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = '登録する';
        showResult({ success: false, message: 'システムエラー: ' + err.message });
      })
      .registerLoan(data);
  }

  function showResult(res) {
    var box   = document.getElementById('resultBox');
    var title = document.getElementById('resultTitle');
    var msg   = document.getElementById('resultMsg');
    box.style.display = 'block';
    if (res.success) {
      box.className = 'result-box';
      title.textContent = '登録完了！伝票番号: ' + res.slipNo;
      msg.innerHTML =
        '<div style="margin-top:8px;">' +
          '<button class="reset-btn" onclick="resetForm()">続けて登録する</button>' +
        '</div>';
      document.getElementById('submitBtn').style.display = 'none';
    } else {
      box.className = 'result-box error';
      title.textContent = 'エラー';
      msg.textContent = res.message;
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtn').textContent = '登録する';
    }
    box.scrollIntoView({ behavior: 'smooth' });
  }

  function resetForm() {
    document.getElementById('mediaSetList').innerHTML = '';
    document.getElementById('itemList').innerHTML = '';
    mediaSetCount = 0;
    itemCount = 0;
    document.getElementById('staff').value = '';
    document.getElementById('name').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('plannedReturnDate').value = '';
    document.getElementById('partialReturnDate').value = '';
    document.getElementById('resultBox').style.display = 'none';
    document.getElementById('submitBtn').style.display = 'block';
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('submitBtn').textContent = '登録する';
    // ピックアップ日は今日にリセット
    var t = new Date();
    var y = t.getFullYear();
    var m = String(t.getMonth() + 1).padStart(2, '0');
    var d = String(t.getDate()).padStart(2, '0');
    document.getElementById('pickupDate').value = y + '-' + m + '-' + d;
    addMediaSet();
    addItem();
    window.scrollTo(0, 0);
  }

  // 初期表示
  addMediaSet();
  addItem();
</script>
</body>
</html>
